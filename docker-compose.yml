version: '3.8'

# ==============================================================================
# Crypto AI Quantitative Trading - Multi-Bot Container Orchestration
# Manages 3x, 10x, 50x live perpetual bots + automated report generator + read-only wallboard
# Supports Host Ollama integration via host.docker.internal:11434
# Includes internal healthcheck probes for zombie/freeze detection
# ==============================================================================

x-bot-defaults: &bot-defaults
  build: .
  restart: unless-stopped
  environment:
    - TZ=Asia/Taipei
    - OLLAMA_BASE_URL=http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/app/data
    - ./journals:/app/journals
    - ./logs:/app/logs
    - ./packages:/app/packages
    - ./apps:/app/apps
    - ./scripts:/app/scripts
  env_file:
    - .env
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: 512M

services:
  swap_50x:
    <<: *bot-defaults
    container_name: quant_swap_50x
    command: python -u apps/cli/autopilot.py --symbol BTC/USDT --leverage 50 --capital 600 --margin-ratio 0.75 --max-loss-pct 50 --arm --run-loop --live --interval 15 --bot-id swap_50x
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--target", "swap_50x", "--max-stale", "90"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reporter:
    <<: *bot-defaults
    container_name: quant_reporter
    command: python -u scripts/cron_runner.py
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--target", "reporter", "--max-stale", "90"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    <<: *bot-defaults
    container_name: quant_dashboard
    command: python -m streamlit run apps/dashboard/cloud_wallboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--target", "dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
