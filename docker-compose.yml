version: '3.8'

# ==============================================================================
# Crypto AI Quantitative Trading - Multi-Bot Container Orchestration
# Manages 3x, 10x, 50x live perpetual bots + automated report generator + read-only wallboard
# Supports Host Ollama integration via host.docker.internal:11434
# Includes internal healthcheck probes for zombie/freeze detection
# ==============================================================================

x-bot-defaults: &bot-defaults
  build: .
  restart: unless-stopped
  environment:
    - TZ=Asia/Taipei
    - AI_PROVIDER=rule
    - OLLAMA_BASE_URL=http://host.docker.internal:11434
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./data:/app/data
    - ./journals:/app/journals
    - ./logs:/app/logs
    - ./packages:/app/packages
    - ./apps:/app/apps
    - ./scripts:/app/scripts
  env_file:
    - .env
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: 512M

services:
  swap_3x:
    <<: *bot-defaults
    container_name: quant_swap_3x
    command: python -u apps/cli/autopilot.py --symbol BTC/USDT --leverage 3 --capital 400 --margin-ratio 0.75 --fixed-margin-sizing --risk-pct 0.02 --arm --run-loop --live --interval 15 --bot-id swap_3x
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--target", "swap_3x", "--max-stale", "90"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reporter:
    <<: *bot-defaults
    container_name: quant_reporter
    command: python -u scripts/cron_runner.py
    volumes:
      - ./.git:/app/.git
      - ./data:/app/data
      - ./journals:/app/journals
      - ./logs:/app/logs
      - ./packages:/app/packages
      - ./apps:/app/apps
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--target", "reporter", "--max-stale", "90"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    restart: unless-stopped
    container_name: quant_dashboard
    command: python -m streamlit run apps/dashboard/cloud_wallboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.maxUploadSize=1 --browser.gatherUsageStats=false
    environment:
      - TZ=Asia/Taipei
      - WALLBOARD_MAX_SESSIONS=15
      - WALLBOARD_MAX_NEW_PER_10S=8
      - WALLBOARD_CIRCUIT_COOLDOWN_SEC=60
    volumes:
      - ./data:/app/data:ro
      - ./journals:/app/journals:ro
      - ./packages:/app/packages:ro
      - ./apps:/app/apps:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "8501:8501"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--target", "dashboard"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
